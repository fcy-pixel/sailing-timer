<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0e1117; color: #fafafa; }

  #container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px;
  }

  #modeBanner {
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 6px 24px;
    border-radius: 20px;
    background: rgba(46,204,113,0.15);
    border: 2px solid #2ecc71;
    color: #2ecc71;
    transition: all 0.3s;
  }
  #modeBanner.finish {
    background: rgba(230,126,34,0.15);
    border-color: #e67e22;
    color: #e67e22;
  }

  #videoWrap {
    position: relative;
    width: 100%;
    max-width: 640px;
    min-height: 240px;
    background: #111;
    border-radius: 8px;
  }
  video {
    width: 100%;
    display: block;
    border-radius: 8px;
    min-height: 240px;
    background: #111;
  }
  canvas { display: block; }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 8px;
    pointer-events: none;
  }

  #status {
    font-size: 1rem;
    padding: 5px 16px;
    border-radius: 16px;
    background: #1e2130;
    border: 1px solid #444;
    min-width: 200px;
    text-align: center;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }

  button {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: bold;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  #btnArm    { background: #2ecc71; color: #111; }
  #btnDisarm { background: #888;    color: #fff; }
  #btnManual { background: #1f77b4; color: #fff; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 640px;
    font-size: 0.85rem;
    color: #aaa;
  }
  .slider-row label { min-width: 100px; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row span { min-width: 36px; text-align: right; }

  #flashOverlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: rgba(46,204,113,0.35);
    border: 4px solid #2ecc71;
    transition: opacity 0.08s;
    z-index: 999;
  }
  #flashOverlay.flash { opacity: 1; }
</style>
</head>
<body>
<div id="flashOverlay"></div>
<div id="container">
  <div id="modeBanner">🟢 起點模式</div>

  <div id="videoWrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">⏳ 等待相機授權…</div>

  <div class="controls">
    <button id="btnArm"    disabled>🟢 啟用偵測</button>
    <button id="btnDisarm" disabled>⛔ 停用偵測</button>
    <button id="btnManual" disabled>▶ 手動觸發</button>
  </div>

  <div class="slider-row">
    <label>感測線位置 (↔)</label>
    <input type="range" id="linePos" min="10" max="90" value="50">
    <span id="linePosVal">50%</span>
  </div>
  <div class="slider-row">
    <label>靈敏度</label>
    <input type="range" id="sensitivity" min="5" max="80" value="25">
    <span id="sensVal">25</span>
  </div>
  <div class="slider-row">
    <label>冷卻時間 (秒)</label>
    <input type="range" id="cooldown" min="1" max="10" value="3" step="0.5">
    <span id="cooldownVal">3s</span>
  </div>
</div>

<script>
// ─── Streamlit bridge ────────────────────────────────────────────────────────
function sendToStreamlit(data) {
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value: data }, "*");
}
function notifyReady() {
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
}
function reportHeight() {
  const h = document.getElementById("container").scrollHeight + 20;
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
}

// ─── Mode ────────────────────────────────────────────────────────────────────
let deviceMode = "start"; // "start" | "finish"

function applyMode() {
  const banner = document.getElementById("modeBanner");
  const flash  = document.getElementById("flashOverlay");
  if (deviceMode === "start") {
    banner.textContent = "🟢 起點模式";
    banner.className   = "";
  } else {
    banner.textContent = "🏁 終點模式";
    banner.className   = "finish";
  }
  drawOverlay();
}

// ─── Args from Python ────────────────────────────────────────────────────────
let cameraReady = false;

function tryAutoArm() {
  if (cameraReady && deviceMode === "finish" && !armed) {
    document.getElementById("btnArm").click();
  }
}

window.addEventListener("message", (ev) => {
  if (ev.data.type === "streamlit:render") {
    const args = ev.data.args || {};
    if (args.mode !== undefined && args.mode !== deviceMode) {
      deviceMode = args.mode;
      applyMode();
      tryAutoArm();  // re-check if camera was already ready
    }
    if (args.line_pos    !== undefined) { document.getElementById("linePos").value    = args.line_pos;    updateLinePos(); }
    if (args.sensitivity !== undefined) { document.getElementById("sensitivity").value = args.sensitivity; updateSens(); }
    if (args.cooldown    !== undefined) { document.getElementById("cooldown").value   = args.cooldown;    updateCooldown(); }
  }
});

notifyReady();
setTimeout(reportHeight, 200);

// ─── Camera setup ────────────────────────────────────────────────────────────
const video    = document.getElementById("video");
const overlay  = document.getElementById("overlay");
const ctx      = overlay.getContext("2d");
const statusEl = document.getElementById("status");
const flash    = document.getElementById("flashOverlay");

let prevGray     = null;
let armed        = false;
let lastTrigger  = 0;
let animId       = null;
let triggerCount = 0;
let linePct      = 0.50;
let sens         = 25;
let cooldownMs   = 3000;

function updateLinePos() {
  linePct = +document.getElementById("linePos").value / 100;
  document.getElementById("linePosVal").textContent = document.getElementById("linePos").value + "%";
  drawOverlay();
}
function updateSens() {
  sens = +document.getElementById("sensitivity").value;
  document.getElementById("sensVal").textContent = sens;
}
function updateCooldown() {
  cooldownMs = +document.getElementById("cooldown").value * 1000;
  document.getElementById("cooldownVal").textContent = document.getElementById("cooldown").value + "s";
}
document.getElementById("linePos").addEventListener("input", updateLinePos);
document.getElementById("sensitivity").addEventListener("input", updateSens);
document.getElementById("cooldown").addEventListener("input", updateCooldown);

function startCamera(constraints) {
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      video.srcObject = stream;
      document.getElementById("btnArm").disabled    = false;
      document.getElementById("btnManual").disabled = false;
      video.onloadedmetadata = () => {
        overlay.width  = video.videoWidth  || 640;
        overlay.height = video.videoHeight || 480;
        startLoop();
        reportHeight();
        cameraReady = true;
        tryAutoArm();  // arm if mode already set to finish
        if (!armed) statusEl.textContent = "✅ 相機就緒 — 按「🟢 啟用偵測」後等待沖線";
      };
      video.onplay = reportHeight;
    })
    .catch(err => {
      if (constraints.video && constraints.video.facingMode) {
        startCamera({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
      } else {
        statusEl.textContent = "❌ 無法存取相機：" + err.message;
      }
    });
}

if (!window.isSecureContext) {
  // HTTP on a local IP — mobile browsers block camera access
  statusEl.innerHTML =
    '⚠️ 需要 HTTPS 才能使用相機<br>'
    + '<small style="color:#f90;line-height:1.8;display:block;margin-top:4px">'
    + '<b>Android Chrome 解決方法：</b><br>'
    + '① 網址列輸入 <b>chrome://flags</b><br>'
    + '② 搜尋「insecure」→「Insecely treat insecure origin as secure」<br>'
    + '③ 將本機網址（如 http://192.168.x.x:8504）加入清單<br>'
    + '④ 重新啟動 Chrome 即可使用相機<br><br>'
    + '<b>iOS Safari：</b>需要 HTTPS，請改用手動觸發按鈕 ▼</small>';
  document.getElementById("btnManual").disabled = false;
  reportHeight();
} else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  startCamera({ video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } } });
} else {
  statusEl.textContent = "❌ 相機授權被拒或不支援，可使用「▶ 手動觸發」";
  document.getElementById("btnManual").disabled = false;
}

// ─── Motion detection ────────────────────────────────────────────────────────
const offCanvas = document.createElement("canvas");
const offCtx    = offCanvas.getContext("2d");

function motionInZone(data, w, zoneH) {
  const result = new Uint8Array(w * zoneH);
  for (let row = 0; row < zoneH; row++) {
    for (let col = 0; col < w; col++) {
      const px = (row * w + col) * 4;
      result[row * w + col] = data[px] * 0.299 + data[px+1] * 0.587 + data[px+2] * 0.114;
    }
  }
  if (!prevGray || prevGray.length !== result.length) { prevGray = result; return 0; }
  let above = 0;
  for (let i = 0; i < result.length; i++) {
    if (Math.abs(result[i] - prevGray[i]) > sens) above++;
  }
  prevGray = result;
  return above / result.length;
}

function startLoop() {
  if (animId) cancelAnimationFrame(animId);
  function loop() {
    if (video.readyState >= 2) {
      const w = overlay.width, h = overlay.height;
      offCanvas.width = w; offCanvas.height = h;
      offCtx.drawImage(video, 0, 0, w, h);
      const lineX = Math.floor(w * linePct);
      const zoneW = Math.max(8, Math.floor(w * 0.04));
      const id    = offCtx.getImageData(lineX, 0, zoneW, h);
      const ratio = motionInZone(id.data, zoneW, h);
      const now   = Date.now();
      if (armed && ratio > 0.06 && (now - lastTrigger) > cooldownMs) {
        lastTrigger = now;
        triggerCount++;
        triggerEvent(ratio);
      }
      drawOverlay(lineX, zoneW, ratio, h, w);
    }
    animId = requestAnimationFrame(loop);
  }
  loop();
}

function triggerEvent(ratio) {
  const isStart = deviceMode === "start";
  flash.style.background  = isStart ? "rgba(46,204,113,0.4)"  : "rgba(230,126,34,0.4)";
  flash.style.borderColor = isStart ? "#2ecc71" : "#e67e22";
  flash.classList.add("flash");
  setTimeout(() => flash.classList.remove("flash"), 300);
  sendToStreamlit({ type: "motion", timestamp: Date.now(), ratio: ratio, count: triggerCount });
  // Auto-disarm locally after one trigger (no separate disarmed event — avoids overwriting motion)
  armed = false;
  document.getElementById("btnArm").disabled    = false;
  document.getElementById("btnDisarm").disabled = true;
  statusEl.textContent = isStart ? `✅ 起點通過！按「🟢 啟用偵測」開下一次` : `✅ 終點通過！成績已記錄`;
  // Finish device: re-arm after short delay so it's ready for next attempt
  if (!isStart && autoArm) {
    setTimeout(() => { if (!armed) document.getElementById("btnArm").click(); }, 2000);
  }
}

function lineColor() {
  return deviceMode === "start" ? "#2ecc71" : "#e67e22";
}

function drawOverlay(lineX, zoneW, motionRatio, h, w) {
  if (lineX === undefined) {
    w = overlay.width; h = overlay.height;
    lineX = Math.floor(w * linePct);
    zoneW = Math.max(8, Math.floor(w * 0.04));
    motionRatio = 0;
  }
  ctx.clearRect(0, 0, w, h);
  const moving = armed && motionRatio > 0.06;
  const mc = lineColor();
  ctx.fillStyle = moving ? "rgba(255,80,80,0.25)" : (deviceMode === "start" ? "rgba(46,204,113,0.1)" : "rgba(230,126,34,0.12)");
  ctx.fillRect(lineX, 0, zoneW, h);
  ctx.strokeStyle = moving ? "#ff4444" : mc;
  ctx.lineWidth   = 3;
  ctx.setLineDash([12, 6]);
  ctx.beginPath(); ctx.moveTo(lineX, 0); ctx.lineTo(lineX, h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lineX + zoneW, 0); ctx.lineTo(lineX + zoneW, h); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font      = "bold 13px monospace";
  ctx.fillStyle = moving ? "#ff4444" : mc;
  const label   = armed
    ? (moving ? "🚨 偵測到！" : (deviceMode === "start" ? "🟢 偵測中（起點）" : "🏁 偵測中（終點）"))
    : (deviceMode === "start" ? "感測線（起點）" : "感測線（終點）");
  ctx.fillText(label, lineX + zoneW + 6, 20);
  const barH = Math.floor((h - 20) * Math.min(motionRatio / 0.3, 1));
  ctx.fillStyle = "rgba(100,150,255,0.5)";
  ctx.fillRect(lineX + zoneW + 4, h - 10 - barH, 5, barH);
  ctx.strokeStyle = "#555"; ctx.lineWidth = 1;
  ctx.strokeRect(lineX + zoneW + 4, 10, 5, h - 20);
}

// ─── Buttons ─────────────────────────────────────────────────────────────────
document.getElementById("btnArm").addEventListener("click", () => {
  armed = true; triggerCount = 0; prevGray = null;
  document.getElementById("btnArm").disabled    = true;
  document.getElementById("btnDisarm").disabled = false;
  statusEl.textContent = deviceMode === "start"
    ? "🟢 偵測中 — 等待風帆車通過起點感測線…"
    : "🏁 偵測中 — 等待風帆車通過終點感測線…";
  sendToStreamlit({ type: "armed", timestamp: Date.now() });
});

document.getElementById("btnDisarm").addEventListener("click", () => {
  armed = false;
  document.getElementById("btnArm").disabled    = false;
  document.getElementById("btnDisarm").disabled = true;
  statusEl.textContent = "⛔ 偵測已停用";
  sendToStreamlit({ type: "disarmed", timestamp: Date.now() });
});

document.getElementById("btnManual").addEventListener("click", () => {
  sendToStreamlit({ type: "manual_trigger", timestamp: Date.now() });
  statusEl.textContent = deviceMode === "start" ? "▶ 手動起點觸發" : "⏹ 手動終點觸發";
});
</script>
</body>
</html>
